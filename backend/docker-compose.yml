services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+pg8000://stwno:stwno@db:5432/stwno_db
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: stwno
      POSTGRES_PASSWORD: stwno
      POSTGRES_DB: stwno_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: